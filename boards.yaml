schema: 1
bin_naming: firmware-<board>-<variant>-<klipper-version>.bin
flash_methods:
  sd-firmware-bin:
  - "1. Copy the downloaded `.bin` to the root of a FAT32-formatted microSD card (\u226432 GB)."
  - 2. Rename the file exactly to `firmware.bin` (no other `.bin` file may remain on the card from a previous
    flash).
  - 3. Power the board OFF, insert the card, power ON.
  - "4. Wait 30\u201360 seconds. The board's status LED usually blinks during the flash."
  - '5. Power off, remove the card, and check the card on your PC: a `FIRMWARE.CUR` file means the flash
    succeeded.'
  - 6. Reinsert the card only if your config reads files from it, then connect the host.
  rp2040-uf2:
  - 1. Unplug the board. Hold the BOOTSEL button while plugging in USB.
  - 2. A drive named `RPBOOT` (or `RPI-RP2`) appears.
  - 3. Copy the downloaded `.uf2` onto that drive. The board reboots automatically.
  dfu-toolhead:
  - 1. Unplug the toolhead board. Hold its BOOT button while plugging in USB.
  - "2. Run `lsusb` \u2014 the board shows as `0483:df11` (STM32 DFU)."
  - 3. `sudo dfu-util -a 0 -d 0483:df11 --dfu-adjust=0x0800 -D <downloaded .bin>`
  - "4. Unplug/replug. (For CAN variants flashed at an 8 KiB offset, flash Katapult first \u2014 see the\
    \ Katapult column.)"
  dfu-board:
  - 1. Put the board in DFU mode (BOOT jumper/button per your board's docs) and plug in USB.
  - 2. `sudo dfu-util -a 0 -d 0483:df11 --dfu-adjust=0x0800 -D <downloaded .bin>`
  - 3. Unplug/replug.
  mks-robin:
  - 1. The downloaded `.bin` is already wrapped for MKS bootloaders (update_mks_robin.py applied at build
    time).
  - 2. Copy it to a FAT32 microSD card, power the printer off, insert the card, power on.
  - 3. Wait for the flash, power off, remove the card.
  ruby:
  - 1. Power off and unplug everything.
  - 2. Bridge the +3.3V pin to the Boot0 pin on the Ruby board (physical jumper).
  - 3. Connect USB to the board (not the printer's other USB) and power on.
  - 4. `make flash FLASH_DEVICE=/dev/serial/by-id/usb-Klipper_stm32f401xc_*-if00` (or dfu-util if the
    device enumerates as DFU).
  - 5. Remove the bridge and power-cycle.
  spider:
  - '1. no-bootloader variant: flash via ST-Link/OpenOCD to 0x08000000, or via DFU if your Spider has
    the DFU bootloader.'
  - '2. 32k-bootloader variant: copy the `.bin` to a FAT32 SD card as `firmware.bin`, power-cycle the
    board with the card inserted.'
boards:
- id: btt-octopus-1.1
  title: BTT Octopus v1.1 (non-Pro)
  chip: STM32F446/F429
  builds:
  - variant: f446-usb
    kconfig:
      CONFIG_LOW_LEVEL_OPTIONS: y
      CONFIG_MACH_STM32: y
      CONFIG_MACH_STM32F446: y
      CONFIG_STM32_FLASH_START_8000: y
      CONFIG_STM32_CLOCK_REF_12M: y
      CONFIG_STM32_USB_PA11_PA12: y
  - variant: f429-usb
    kconfig:
      CONFIG_LOW_LEVEL_OPTIONS: y
      CONFIG_MACH_STM32: y
      CONFIG_MACH_STM32F429: y
      CONFIG_STM32_FLASH_START_8000: y
      CONFIG_STM32_CLOCK_REF_8M: y
      CONFIG_STM32_USB_PA11_PA12: y
  flash: sd-firmware-bin
  source: "klipper: config/generic-bigtreetech-octopus-v1.1.cfg \u2014 F446: 32KiB bootloader + 12MHz;\
    \ F429: 32KiB + 8MHz. Cross-checked 3dwork btt-octopus-11 (F446)."
  notes: []
  warnings:
  - "Octopus v1.1 (non-Pro) bins must NOT be used on an Octopus Pro v1.1 \u2014 wrong pin mapping can\
    \ enable a heater inadvertently."
